name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, feature/homework_35.2 ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flake8
        run: pip install flake8
      - name: Run Flake8
        run: flake8 . --count --max-complexity=10 --max-line-length=119 --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run tests
        run: poetry run python manage.py test
        env:
          SECRET_KEY: 'test-secret-key-for-ci-12345'
          DEBUG: '1'
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ':memory:'

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/homework_35.2'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/homework8:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/homework_35.2'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/homework8
            
            # Скачиваем свежий образ
            docker-compose pull
            
            # Перезапускаем контейнеры
            docker-compose up -d --force-recreate
            
            # Применяем миграции
            docker-compose exec -T web python manage.py migrate --noinput
            
            # Собираем статику
            docker-compose exec -T web python manage.py collectstatic --noinput
            
            # Очищаем неиспользуемые образы
            docker image prune -f