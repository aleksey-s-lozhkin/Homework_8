name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, feature/homework_35.2 ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flake8
        run: pip install flake8
      - name: Run Flake8
        run: flake8 . --count --max-complexity=10 --max-line-length=119 --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run tests
        run: poetry run python manage.py test
        env:
          SECRET_KEY: 'test-secret-key'
          DEBUG: '1'
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ':memory:'

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/homework_35.2'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/homework8:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/homework_35.2'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/${{ secrets.SERVER_USER }}/homework8/nginx
            cd /home/${{ secrets.SERVER_USER }}/homework8

            # Создаем .env
            cat > .env << 'EOF'
            SECRET_KEY='${{ secrets.SECRET_KEY }}'
            ALLOWED_HOSTS='${{ secrets.ALLOWED_HOSTS }}'
            DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            STRIPE_SECRET_KEY='${{ secrets.STRIPE_SECRET_KEY }}'
            EMAIL_HOST_USER='${{ secrets.EMAIL_HOST_USER }}'
            EMAIL_HOST_PASSWORD='${{ secrets.EMAIL_HOST_PASSWORD }}'
            EOF

            # Создаем nginx.conf
            cat > nginx/nginx.conf << 'EOF'
            server {
                listen 80;
                server_name pyconstrictor.ru 31.184.253.113;
                client_max_body_size 100M;

                location /static/ {
                    alias /staticfiles/;
                }

                location /media/ {
                    alias /media/;
                }

                location / {
                    proxy_pass http://web:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            # Создаем nginx/Dockerfile
            cat > nginx/Dockerfile << 'EOF'
            FROM nginx:alpine
            COPY nginx.conf /etc/nginx/conf.d/default.conf
            EXPOSE 80
            EOF

            # Создаем docker-compose.yml
            cat > docker-compose.yml << 'EOF'
            services:
              db:
                image: postgres:15-alpine
                environment:
                  POSTGRES_DB: homework_8
                  POSTGRES_USER: asl
                  POSTGRES_PASSWORD: '${{ secrets.DB_PASSWORD }}'
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U asl -d homework_8"]
                  interval: 5s
                  timeout: 3s
                  retries: 5
                restart: unless-stopped

              redis:
                image: redis:7-alpine
                volumes:
                  - redis_data:/data
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 5s
                  timeout: 3s
                  retries: 5
                restart: unless-stopped

              web:
                image: ${{ secrets.DOCKER_USERNAME }}/homework8:latest
                command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
                expose:
                  - "8000"
                environment:
                  DEBUG: 'False'
                  SECRET_KEY: '${{ secrets.SECRET_KEY }}'
                  ALLOWED_HOSTS: '${{ secrets.ALLOWED_HOSTS }}'
                  DB_NAME: homework_8
                  DB_USER: asl
                  DB_PASSWORD: '${{ secrets.DB_PASSWORD }}'
                  DB_HOST: db
                  DB_PORT: 5432
                  REDIS_URL: redis://redis:6379/0
                  CELERY_BROKER_URL: redis://redis:6379/0
                  CELERY_RESULT_BACKEND: redis://redis:6379/0
                  STRIPE_SECRET_KEY: '${{ secrets.STRIPE_SECRET_KEY }}'
                  EMAIL_HOST_USER: '${{ secrets.EMAIL_HOST_USER }}'
                  EMAIL_HOST_PASSWORD: '${{ secrets.EMAIL_HOST_PASSWORD }}'
                volumes:
                  - static_volume:/app/staticfiles
                  - media_volume:/app/media
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                restart: unless-stopped

              nginx:
                build: ./nginx
                ports:
                  - "80:80"
                volumes:
                  - static_volume:/staticfiles
                  - media_volume:/media
                depends_on:
                  - web
                restart: unless-stopped

              celery:
                image: ${{ secrets.DOCKER_USERNAME }}/homework8:latest
                command: celery -A config worker -l info
                environment:
                  DEBUG: 'False'
                  SECRET_KEY: '${{ secrets.SECRET_KEY }}'
                  DB_NAME: homework_8
                  DB_USER: asl
                  DB_PASSWORD: '${{ secrets.DB_PASSWORD }}'
                  DB_HOST: db
                  DB_PORT: 5432
                  REDIS_URL: redis://redis:6379/0
                  CELERY_BROKER_URL: redis://redis:6379/0
                  CELERY_RESULT_BACKEND: redis://redis:6379/0
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                restart: unless-stopped

              celery-beat:
                image: ${{ secrets.DOCKER_USERNAME }}/homework8:latest
                command: celery -A config beat -l info
                environment:
                  DEBUG: 'False'
                  SECRET_KEY: '${{ secrets.SECRET_KEY }}'
                  DB_NAME: homework_8
                  DB_USER: asl
                  DB_PASSWORD: '${{ secrets.DB_PASSWORD }}'
                  DB_HOST: db
                  DB_PORT: 5432
                  REDIS_URL: redis://redis:6379/0
                  CELERY_BROKER_URL: redis://redis:6379/0
                  CELERY_RESULT_BACKEND: redis://redis:6379/0
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                restart: unless-stopped

              flower:
                image: ${{ secrets.DOCKER_USERNAME }}/homework8:latest
                command: celery -A config flower --port=5555 --address=0.0.0.0
                ports:
                  - "5555:5555"
                environment:
                  CELERY_BROKER_URL: redis://redis:6379/0
                  CELERY_RESULT_BACKEND: redis://redis:6379/0
                depends_on:
                  - redis
                  - celery
                restart: unless-stopped

            volumes:
              postgres_data:
              redis_data:
              static_volume:
              media_volume:
            EOF

            # Запускаем контейнеры
            docker-compose pull
            docker-compose up -d --build

            sleep 15
            docker-compose exec -T web python manage.py migrate --noinput || true
            docker-compose exec -T web python manage.py collectstatic --noinput || true

            docker image prune -f