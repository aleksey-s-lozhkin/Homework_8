name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, feature/homework_35.2 ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flake8
        run: pip install flake8
      - name: Run Flake8
        run: flake8 . --count --max-complexity=10 --max-line-length=119 --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run tests
        run: poetry run python manage.py test
        env:
          SECRET_KEY: 'test-secret-key-for-ci-12345'
          DEBUG: '1'
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ':memory:'

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/homework_35.2'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/homework8:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/homework_35.2'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/${{ secrets.SERVER_USER }}/homework8
            cd /home/${{ secrets.SERVER_USER }}/homework8
            
            # Создаем docker-compose.yml
            cat > docker-compose.yml << 'EOF'
            services:
              db:
                image: postgres:15-alpine
                environment:
                  POSTGRES_DB: ${DB_NAME}
                  POSTGRES_USER: ${DB_USER}
                  POSTGRES_PASSWORD: ${DB_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
                  interval: 5s
                  timeout: 3s
                  retries: 5
                restart: unless-stopped
            
              redis:
                image: redis:7-alpine
                volumes:
                  - redis_data:/data
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 5s
                  timeout: 3s
                  retries: 5
                restart: unless-stopped
            
              web:
                image: ${{ secrets.DOCKER_USERNAME }}/habit-tracker:latest
                command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
                expose:
                  - "8000"
                environment:
                  DEBUG: 'False'
                  SECRET_KEY: '${{ secrets.SECRET_KEY }}'
                  ALLOWED_HOSTS: '${{ secrets.ALLOWED_HOSTS }}'
                  DB_NAME: habit_tracker
                  DB_USER: habit_user
                  DB_PASSWORD: '${{ secrets.DB_PASSWORD }}'
                  DB_HOST: db
                  DB_PORT: 5432
                  REDIS_URL: redis://redis:6379/0
                  TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'
                  PAGE_SIZE: '5'
                volumes:
                  - static_volume:/app/staticfiles
                  - media_volume:/app/media
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                restart: unless-stopped
            
              nginx:
                image: nginx:alpine
                ports:
                  - "80:80"
                volumes:
                  - static_volume:/staticfiles
                  - media_volume:/media
                depends_on:
                  - web
                restart: unless-stopped
            
              celery:
                image: ${{ secrets.DOCKER_USERNAME }}/habit-tracker:latest
                command: celery -A config worker -l info
                environment:
                  DEBUG: 'False'
                  SECRET_KEY: '${{ secrets.SECRET_KEY }}'
                  DB_NAME: habit_tracker
                  DB_USER: habit_user
                  DB_PASSWORD: '${{ secrets.DB_PASSWORD }}'
                  DB_HOST: db
                  DB_PORT: 5432
                  REDIS_URL: redis://redis:6379/0
                  TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                restart: unless-stopped
            
              celery-beat:
                image: ${{ secrets.DOCKER_USERNAME }}/habit-tracker:latest
                command: celery -A config beat -l info
                environment:
                  DEBUG: 'False'
                  SECRET_KEY: '${{ secrets.SECRET_KEY }}'
                  DB_NAME: habit_tracker
                  DB_USER: habit_user
                  DB_PASSWORD: '${{ secrets.DB_PASSWORD }}'
                  DB_HOST: db
                  DB_PORT: 5432
                  REDIS_URL: redis://redis:6379/0
                  TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                restart: unless-stopped
            
            volumes:
              postgres_data:
              redis_data:
              static_volume:
              media_volume:
            EOF
            
            # Создаем .env файл
            cat > .env << 'EOF'
            SECRET_KEY='${{ secrets.SECRET_KEY }}'
            ALLOWED_HOSTS='${{ secrets.ALLOWED_HOSTS }}'
            DB_NAME=habit_tracker
            DB_USER=habit_user
            DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}'
            EOF
            
            # Запускаем контейнеры
            docker-compose pull
            docker-compose up -d --force-recreate
            sleep 10
            docker-compose exec -T web python manage.py migrate --noinput || true
            docker-compose exec -T web python manage.py collectstatic --noinput || true
            docker image prune -f