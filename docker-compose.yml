services:
  db:
    image: postgres:15-alpine
    container_name: homework8_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - homework8_network

  redis:
    image: redis:7-alpine
    container_name: homework8_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - homework8_network

  web:
    build: .
    container_name: homework8_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - homework8_network

  celery:
    build: .
    container_name: homework8_celery
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - homework8_network

  celery-beat:
    build: .
    container_name: homework8_celery_beat
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - homework8_network

  flower:
    build: .
    container_name: homework8_flower
    command: celery -A config flower --port=5555 --address=0.0.0.0
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - celery
    networks:
      - homework8_network

  nginx:
    build: ./nginx
    container_name: homework8_nginx
    ports:
      - "8080:80"
    volumes:
      - static_volume:/staticfiles
      - media_volume:/media
    depends_on:
      - web
    networks:
      - homework8_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  homework8_network:
    driver: bridge