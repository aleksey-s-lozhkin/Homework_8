[tool.poetry]
name = "homework-8"
version = "0.1.0"
description = "Платформа онлайн-обучения"
authors = ["Aleksey Lozhkin <aleksey.s.lozhkin@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
django = ">=6.0.2,<7.0.0"
djangorestframework = ">=3.16.1,<4.0.0"
psycopg2-binary = ">=2.9.11,<3.0.0"
python-dotenv = ">=1.2.1,<2.0.0"
pillow = ">=12.1.1,<13.0.0"
django-filter = ">=25.2,<26.0"
djangorestframework-simplejwt = ">=5.5.1,<6.0.0"
coverage = ">=7.13.4,<8.0.0"
drf-spectacular = ">=0.29.0,<0.30.0"
stripe = ">=14.4.1,<15.0.0"
celery = ">=5.6.2,<6.0.0"
redis = ">=7.3.0,<8.0.0"
django-celery-beat = ">=2.9.0,<3.0.0"
celery-types = ">=0.26.0,<0.27.0"
gunicorn = ">=25.3.0,<26.0.0"
flower = "^2.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-django = "^4.8.0"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.17.0"
black = "^25.1.0"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = "venv/|.venv/|build/|dist/|.mypy_cache/|tests*"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.black]
line-length = 119
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip = [".venv", "venv"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=html --cov-report=term --cov-fail-under=80"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"